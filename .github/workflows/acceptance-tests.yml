name: Acceptance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Terraform provider repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull private backend image
        run: docker pull shivraj1192/taskmanager-go:latest

      - name: Run TaskManager backend container
        run: |
          docker run -d --name taskmanager-backend \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_NAME=taskmanager \
            -p 8080:8080 \
            shivraj1192/taskmanager-go:latest
          sleep 10

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Make get_token.sh executable
        run: chmod +x get_token.sh

      - name: Generate token from backend
        run: ./get_token.sh

      - name: Run Acceptance Tests
        env:
          TF_ACC: 1
          BASE_URL: ${{secrets.BASE_URL}}
          TOKEN: ${{ env.TOKEN }}
        run: go test -v ./test_taskmanager

      - name: Show container logs
        if: always()
        run: docker logs taskmanager-backend
